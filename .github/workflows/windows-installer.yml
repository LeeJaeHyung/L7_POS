name: 윈도우 설치 파일 빌드

# jpackage 는 크로스 빌드를 못 하므로 윈도우 러너에서 빌드한다.
# 자바 런타임은 jpackage 가 함께 넣어주고,
# SQLite 는 sqlite-jdbc jar 안의 DLL 이 쓰이므로 별도 처리가 없다.

on:
  workflow_dispatch:      # 액션 탭에서 수동 실행
  push:
    tags:
      - 'v*'              # v1.0.0 같은 태그를 밀면 자동 빌드

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: JDK 21 준비
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 설치 파일 만들기
        run: ./gradlew jpackage --no-daemon

      - name: 결과 확인
        shell: pwsh
        run: |
          Get-ChildItem build\jpackage -Recurse |
            Select-Object Name, @{Name='MB';Expression={[math]::Round($_.Length/1MB,1)}}

      - name: exe 올리기
        uses: actions/upload-artifact@v4
        with:
          name: L7_POS-windows-installer
          path: build/jpackage/*.exe
          if-no-files-found: error
          retention-days: 30
